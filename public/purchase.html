<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Your Website — Website Market</title>
    <meta name="description" content="Search your business name and purchase your professionally built website.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- NAVIGATION -->
    <nav id="nav">
        <a href="/" class="nav-logo">Website<span>Market</span></a>
        <a href="/" class="nav-cta">← Back</a>
    </nav>

    <!-- HERO -->
    <section id="hero">
        <div class="hero-inner">
            <h1 class="hero-h1">Find your<br><em>business.</em></h1>
            <p class="hero-sub">Search your name to get started.</p>
            <div class="search-wrap">
                <div class="search-box" id="searchBox">
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search your business name…"
                        autocomplete="off"
                        spellcheck="false"
                        aria-label="Search for your business"
                    />
                    <button class="search-btn" id="searchBtn">Search</button>
                </div>
            </div>
        </div>
    </section>

    <!-- SEARCH RESULTS -->
    <section id="results-section" aria-live="polite" aria-label="Search results">
        <div class="results-inner">
            <div class="results-header">
                <h2 class="results-title" id="resultsTitle"></h2>
                <p class="results-count" id="resultsCount"></p>
            </div>
            <div class="results-grid" id="resultsGrid"></div>
        </div>
    </section>

    <!-- PRICING MODAL -->
    <div id="modal-overlay" role="dialog" aria-modal="true" aria-label="Purchase">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-business-name" id="modalBusinessName"></span>
                <div class="modal-actions">
                    <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
                </div>
            </div>
            <div class="modal-body">
                <div id="modalPricing" class="modal-pricing" style="display:block"></div>
            </div>
        </div>
    </div>

    <script type="module" src="js/purchase.js"></script>
</body>
</html>
