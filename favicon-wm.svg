<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#252220"/>
  <!-- M strokes: left post up, diagonal to center valley, diagonal back up, right post down -->
  <!-- W on top: center peak up, outer legs down to midline -->
  <polyline points="7,5 7,16 16,5 25,16 25,5"
            fill="none" stroke="#f5f0ec" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- M on bottom: center valley down, outer legs up to midline -->
  <polyline points="7,27 7,16 16,27 25,16 25,27"
            fill="none" stroke="#f5f0ec" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
</svg>
