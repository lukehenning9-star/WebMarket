<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#252220"/>
  <g fill="none" stroke="#f5f0ec" stroke-width="2" stroke-linejoin="miter" stroke-linecap="butt">
    <!-- W left outer post -->
    <line x1="4" y1="5" x2="4" y2="27"/>
    <!-- W inner strokes (upside-down M: valleys at bottom, peak near top) -->
    <polyline points="4,27 10,11 16,27"/>
    <!-- Shared center post (rightmost W bar = leftmost M bar) -->
    <line x1="16" y1="5" x2="16" y2="27"/>
    <!-- M inner strokes (peak at top, valley near bottom) -->
    <polyline points="16,5 22,21 28,5"/>
    <!-- M right outer post -->
    <line x1="28" y1="5" x2="28" y2="27"/>
  </g>
</svg>
