<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#252220"/>
  <!-- M strokes: left post up, diagonal to center valley, diagonal back up, right post down -->
  <!-- M on top: posts y=5–14, center valley touches y=16 -->
  <polyline points="5,14 5,5 16,16 27,5 27,14"
            fill="none" stroke="#f5f0ec" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
  <!-- W on bottom: posts y=18–27, center peak touches y=16 -->
  <polyline points="5,18 5,27 16,16 27,27 27,18"
            fill="none" stroke="#f5f0ec" stroke-width="2.5" stroke-linejoin="miter" stroke-linecap="square"/>
</svg>
