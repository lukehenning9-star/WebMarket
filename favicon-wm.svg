<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#252220"/>
  <g fill="#f5f0ec">
    <!-- W left outer bar -->
    <rect x="1.5" y="6" width="3" height="20"/>
    <!-- W left diagonal bar (center-line: bottom of left bar → peak at 9.5,10) -->
    <polygon points="4.4,26.6 10.9,10.6 8.1,9.4 1.6,25.4"/>
    <!-- W right diagonal bar (center-line: peak at 9.5,10 → bottom of center bar) -->
    <polygon points="8.1,10.6 14.6,26.6 17.4,25.4 10.9,9.4"/>
    <!-- Shared center bar (rightmost W bar = leftmost M bar) -->
    <rect x="14.5" y="6" width="3" height="20"/>
    <!-- M left diagonal bar (center-line: top of center bar → valley at 22.5,22) -->
    <polygon points="14.6,6.6 21.1,22.6 23.9,21.4 17.4,5.4"/>
    <!-- M right diagonal bar (center-line: valley at 22.5,22 → top of right bar) -->
    <polygon points="23.9,22.6 30.4,6.6 27.6,5.4 21.1,21.4"/>
    <!-- M right outer bar -->
    <rect x="27.5" y="6" width="3" height="20"/>
  </g>
</svg>
